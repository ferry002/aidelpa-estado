# Monitor de disponibilidad de AIDELPA (Upptime, licencia MIT). Revisa cada 5 minutos; si algo cae, abre un
# issue asignado a ferry002 (GitHub avisa por correo) y lo cierra solo cuando vuelve.
owner: ferry002
repo: aidelpa-estado

sites:
  - name: API
    url: https://padel-ai-saas-api.onrender.com/salud
    maxResponseTime: 60000 # el plan gratis de Render tarda en despertar; no contarlo como caída
  - name: App web
    url: https://frontend-red-iota-71.vercel.app

assignees:
  - ferry002

status-website:
  baseUrl: /aidelpa-estado
  name: Estado de AIDELPA
  introTitle: "Estado de AIDELPA"
  introMessage: Disponibilidad de la app y de su servidor, revisada cada 5 minutos.
  navbar:
    - title: Estado
      href: /
